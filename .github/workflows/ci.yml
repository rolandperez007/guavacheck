name: Austin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest

      - name: Black
        run: |
          black --check .

      - name: Flake8
        run: |
          flake8 app

      - name: Compile
        run: |
          python -m py_compile app/main.py

      - name: Import Validation
        run: |
          python -c "import app.main"

      - name: Austin Engine Validation
        run: |
          python -c "from app.core.austin_engine import AustinEngine; print('ENGINE OK')"

      - name: Pytest
        run: |
          pytest